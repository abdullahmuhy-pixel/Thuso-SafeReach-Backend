version: 2.1
jobs:
  build-and-test:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Run automated tests
          command: npm test
workflows:
  backend-ci:
    jobs:
      - build-and-test:
          filters:
            branches:
              only: main
